<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-light">
    <header class="bg-black text-white text-center py-2 mb-4 border-bottom border-secondary">
        <h1>Planificador de Tareas</h1>
    </header>

<main class="container">
        <div class="row">

            <!-- COLUMNA IZQUIERDA -->
            <div class="col-md-4 mb-4">
                <!-- CALENDARIO -->
                <div class="card p-4 mb-3 shadow-sm text-center">
                    <h5 class="text-white">CALENDARIO</h5>
                    <div class="bg-secondary bg-opacity-15 p-4 text-center rounded text-muted">
                        [Calendario Estatico]
                    </div>
                </div>

                <!-- FORMULARIO -->
                <div class="card p-4 mb-3 shadow-sm text-center">
                    <h5 class="mb-4">AGREGAR NUEVA TAREA</h5>

                    <div id="alertError" class="alert alert-danger d-none py-3 mb-3 small fw-bold shadow-sm border-0 rounded-3 text-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> Completa todos los campos requeridos.
                    </div>

                    <form id="taskForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-white">TITULO</label>
                            <input type="text" class="form-control text-center" id="newTaskNameInput" placeholder="Dale un titulo a tu tarea">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white fw-bold">DESCRIPCIÓN</label>
                            <textarea class="form-control text-center" id="newTaskDescriptionInput" rows="2" placeholder="Descripcion..."></textarea>
                        </div>

                        <!-- Campo único de fecha (y opción desplegable para elegir un rango hasta otra fecha) -->
                        <div class="mb-3">
                            <label class="form-label text-white fw-bold" for="newTaskStartDateInput">FECHA</label>
                            <input type="date" class="form-control text-center" id="newTaskStartDateInput">

                            <div class="mt-2">
                                <button
                                    type="button"
                                    id="toggleRangeBtn"
                                    class="btn btn-outline-secondary btn-sm py-1 px-2 small"
                                >
                                    <i class="bi bi-calendar-range"></i> Elegir rango de fechas
                                </button>
                            </div>

                            <div id="endDateWrapper" class="mt-2 d-none">
                                <label class="form-label text-muted small fw-bold mb-1" for="newTaskEndDateInput">HASTA LA FECHA</label>
                                <input type="date" class="form-control text-center" id="newTaskEndDateInput">
                            </div>
                        </div>

                        <div class="d-flex justify-content-center">
                            <button type="submit" class="btn btn-light w-50 fw-bold">AGREGAR TAREA</button>
                        </div>
                    </form>
                </div>

                <!-- MIS TAREAS HOY -->
                <div class="card p-4 mb-3 shadow-sm text-start">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="text-white mb-0 fw-bold">MIS TAREAS HOY</h6>
                        <span class="badge bg-light text-dark small">
                            <i class="bi bi-clock"></i> Hoy
                        </span>
                    </div>

                    <!-- Se llena dinámicamente desde renderTodayTasks() en js/app.js -->
                    <ul id="todayTasksList" class="list-unstyled small mb-0"></ul>
                </div>
            </div>

            <!-- COLUMNA DERECHA: Lista de Tareas -->
            <div class="col-md-8 mb-4">
                <div class="card p-4 shadow-sm text-center">
                    <h4 class="mb-4">LISTA DE TAREAS</h4>

                    <!-- Contenedor dinámico: las tarjetas se generan desde taskManager.render() -->
                    <div id="tasksContainer" class="row g-3"></div>
                </div>
            </div>

            <!-- BOTÓN INFERIOR: Switch DM (Modo oscuro / claro) -->
            <div class="row mt-2">
                <div class="col-12 text-center">
                    <div class="form-check form-switch d-inline-block">
                        <!-- El input tipo checkbox hace la función del switch -->
                        <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
                        <!-- Label con el icono o texto -->
                        <label class="form-check-label fw-bold ms-2" for="flexSwitchCheckChecked">🌙 Modo Oscuro</label>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script src="js/taskManager.js"></script>
<script src="js/app.js"></script>
</body>
</html>
