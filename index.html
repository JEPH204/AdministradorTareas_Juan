<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-light">
    <header class="bg-black text-white text-center py-2 mb-4 border-bottom border-secondary">
        <h1>Planificador de Tareas</h1>
    </header>

    <!---CONTENEDOR IZQUIERDA --->
    <main class="container">
        <div class="row">
            <div class="col-md-4 mb-4">
                <!--CALENDARIO-->
                <div class="card p-4 mb-3 shadow-sm text-center">
                    <h5 class="text-white">CALENDARIO</h5>
                    <div class="bg-secondary bg-opacity-15 p4 text-center rounded text-muted">
                        [Calendario Estatico]
                    </div>
                </div>

                <!---FORMULARIO--->
                <div class="card p-4 shadow-sm text-center">
                    <h5 class="mb-4">AGREGAR NUEVA TAREA</h5>
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-white">TITULO</label>
                            <input type="text" class="form-control text-center" placeholder="Dale un titulo a tu tarea">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white fw-bold">DESCRIPCIÓN</label>
                            <textarea class="form-control text-center" rows="2" placeholder="Descripcion..."></textarea>
                        </div class="d-flex justify-content-center">
                        <button type="button" class="btn btn-light w-50 fw-bold">AGREGAR TAREA</button>
                    </form>
                </div>
            </div>



        <!-- COLUMNA CENTRAL: Lista de Tareas -->
            <div class="col-md-6 mb-4">
                <div class="card p-3 shadow-sm text-center">
                    <h4 class="mb-3">LISTA DE TAREAS</h4>
                    <!-- Contenedor de Tarjetas de Tarea de ejemplo -->
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="card border-secondary p-3">
                                <h6 class="text-muted fw-bold">Tarea X</h6>
                                <h5 class="card-title">Título de ejemplo</h5>
                                <p class="card-text fw-semibold text-muted small">Descripción de la tarea aquí...</p>
                                <button class="btn btn-outline-secondary btn-sm">Detalles</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-2">
                <div class="card p-4 shadow-sm text-center">
                    <h6 class="text-white mb-3">CONTADOR TAREAS</h6>
                    <div class="d-grid gap-2">
                        <span class="badge bg-success text-dark p-2">COMPLETADAS : </span>
                        <span class="badge bg-warning text-dark p-2">EN PROCESO : </span>
                        <span class="badge bg-secondary text-dark p-2">POR HACER : </span>
                    </div>
                </div>
            </div>

            <!-- BOTÓN INFERIOR: Switch DM (Modo oscuro / claro) -->
            <div class="row mt-4">
                        <div class="col-12 text-center">
                            <div class="form-check form-switch d-inline-block">
                                <!-- El input tipo checkbox hace la función del switch -->
                                <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
                                <!-- Label con el icono o texto -->
                                <label class="form-check-label fw-bold ms-2" for="flexSwitchCheckChecked">🌙 Modo Oscuro</label>
                            </div>
                        </div>
                    </div>
    </main>


    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
